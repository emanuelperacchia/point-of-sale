spring:
  application:
    name: POS System

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: pos_user
    password: ${POSTGRES_PASSWORD:pos_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PosHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:12}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  devtools:
    restart:
      enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

jwt:
  secret: ${JWT_SECRET:tu_clave_secreta_muy_larga_y_segura_de_al_menos_32_caracteres}
  expiration: 900000
  refresh-expiration: 604800000

pos:
  crypto:
    key: ${POS_CRYPTO_KEY:una_clave_de_cifrado_de_al_menos_32_caracteres}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

security:
  rate-limit:
    login-attempts: 5
    lockout-duration: 900000

fiscal:
  mode: mock
  retry:
    max-attempts: 3
    interval-ms: 30000
  mock:
    success-rate: 0.95
    delay-ms: 300
  pdf:
    output-dir: ./invoices
  email:
    enabled: false
  afip:
    wsaa-homologacion: https://wsaahomo.afip.gov.ar/ws/services/LoginCms
    wsaa-produccion: https://wsaa.afip.gov.ar/ws/services/LoginCms
    wsfe-homologacion: https://wswhomo.afip.gov.ar/wsfev1/service.asmx
    wsfe-produccion: https://servicios1.afip.gov.ar/wsfev1/service.asmx
    ta-refresh-interval-ms: 3600000

returns:
  auto-approve-limit: 5000

file-storage:
  upload-dir: ./uploads

logging:
  level:
    com.pos.system: INFO
    org.hibernate.SQL: WARN